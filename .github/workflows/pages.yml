# Publishes the site to GitHub Pages on every push to main. First tools/3_publish_site/tests/exports_match.py checks every download
# (spreadsheet, PDF, slides) says exactly what the site says; if any doesn't, nothing is published. Then Jekyll builds
# the site (honouring _config.yml's exclude list) and tools/3_publish_site/publish_site.py strips comments, stamps every ?v= with the
# commit and writes the sitemap.
# The Pages source must be "GitHub Actions" (Settings > Pages > Build and deployment).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # every download must say what the site says: if one doesn't, nothing is published and the live site stays as it was
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every download matches the site
        run: |
          pip install --quiet openpyxl pycel pymupdf python-pptx holidays
          python -I tools/3_publish_site/tests/exports_match.py .
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Strip comments, stamp the version, write the sitemap
        run: sudo python3 tools/3_publish_site/publish_site.py _site "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
