<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Month-End Run | The Fourth Sheet</title>
  <meta name="description" content="The Month-End Run: a 30-second game about month-end done by hand, then done with reporting that's built once and refreshed on a schedule. From The Fourth Sheet." />
  <link rel="icon" href="../assets/brand/mark-4th.svg?v=sheet" type="image/svg+xml" />
  <link rel="icon" href="../assets/brand/mark-4th-32.png?v=sheet" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <!--
    The Month-End Run — game page.
    Opened directly (…/game/) it fills the window. The website loads it in an
    iframe with ?embed=1 once a visitor presses Play.
    Game code and all the numbers it shows: game.js (CONFIG at the top).
  -->
  <style>
    /* Colours match the website (styles.css :root) */
    :root {
      --bg: #f4f7f2; --surface: #fbfdf9; --border: #dce8dc; --text: #25342a;
      --muted: #5f6f63; --accent: #2f7a5d; --accent-soft: #eaf6ee;
      --font: 'Press Start 2P', 'Courier New', monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    /* In the website's iframe: no page padding, no full-height centring */
    .embedded body { min-height: 0; padding: 0; display: block; background: transparent; }

    .game-wrap { width: 100%; max-width: 1600px; }

    /* The canvas plus the clickable end-card buttons laid over it */
    .stage { position: relative; width: fit-content; margin: 0 auto; }
    #game-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--bg);
      border: 2px solid var(--text);
      touch-action: manipulation;
    }
    /* Keyboard focus recolours the one border instead of adding an outline
       outside it (an outside outline got clipped by the website's iframe and
       showed as a second, unfinished line). */
    #game-canvas:focus, #game-canvas:focus-visible { outline: none; }
    #game-canvas:focus-visible { border-color: var(--accent); }

    /* Invisible real link/button over the drawn end-card buttons (so the
       call to action is a proper, clickable, keyboard-reachable link). */
    .overlay-btn {
      position: absolute;
      margin: 2px; /* the canvas border */
      background: transparent;
      border: 0;
      color: transparent;
      font-size: 1px;
      cursor: pointer;
    }
    .overlay-btn[hidden] { display: none; }
    .overlay-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .game-below { max-width: 640px; margin: 12px auto 0; }
    .game-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    .game-bar button {
      min-height: 40px;
      padding: 8px 12px;
      font-family: var(--font);
      font-size: 10px;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--text);
      cursor: pointer;
    }
    .game-bar button:disabled { opacity: 0.45; cursor: default; }
    .game-bar button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #sound-btn[aria-pressed="true"] { background: var(--accent-soft); }

    /* Touch controls: only on touch screens */
    .game-touch { display: none; }
    @media (pointer: coarse) {
      .game-touch {
        display: grid;
        grid-template-columns: 72px 72px 1fr 96px;
        grid-template-areas: "left right . jump";
        gap: 10px;
        margin-top: 12px;
        user-select: none;
        -webkit-user-select: none;
      }
      .game-touch button {
        height: 64px;
        font-family: var(--font);
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        border: 2px solid var(--text);
        touch-action: none;
      }
      .game-touch [data-key="left"] { grid-area: left; }
      .game-touch [data-key="right"] { grid-area: right; }
      .game-touch [data-key="jump"] { grid-area: jump; background: var(--accent); color: #fff; font-size: 12px; }
      .game-touch .is-down { transform: translateY(2px); filter: brightness(0.9); }
      html .game-help { font-size: 12px; }
      html .game-help .help-keys { display: none; }
      html .game-help .help-touch { display: inline; }
    }

    .game-help { margin: 12px 0 0; font-size: 8px; line-height: 2; text-align: center; color: var(--muted); }
    .game-help .help-touch { display: none; }
    html.touch .game-help { font-size: 12px; }
    html.touch .game-help .help-keys { display: none; }
    html.touch .game-help .help-touch { display: inline; }
    @media (max-width: 480px) { .game-help { font-size: 12px; } }
    .game-help a { color: var(--accent); }
    .embedded .game-help .back { display: none; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
  <script>
    // Mark the page as embedded before it draws, so the layout doesn't jump
    if (window.self !== window.top || /[?&]embed/.test(location.search)) document.documentElement.classList.add('embedded');
    // Touch screens get touch instructions (some phones don't report a coarse pointer)
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.documentElement.classList.add('touch');
  </script>
</head>
<body>
  <main class="game-wrap">
    <div class="stage">
      <canvas id="game-canvas" width="256" height="144" tabindex="0"
        aria-label="The Month-End Run: a short game. Month-end done by hand, then with reporting that's built once and refreshed on a schedule. Press Enter to start."></canvas>
      <!-- End-card buttons (positioned by game.js over the drawn ones) -->
      <a class="overlay-btn" id="cta-book" hidden>Book a free 20-minute numbers check</a>
      <button class="overlay-btn" id="cta-again" type="button" hidden>Play again</button>
    </div>

    <div class="game-below">
      <div class="game-bar">
        <button type="button" id="skip-btn">Skip to results</button>
        <button type="button" id="sound-btn" aria-pressed="false">Sound: off</button>
      </div>
      <div class="game-touch" aria-hidden="true">
        <button type="button" tabindex="-1" data-key="left">&#9664;</button>
        <button type="button" tabindex="-1" data-key="right">&#9654;</button>
        <button type="button" tabindex="-1" data-key="jump">JUMP</button>
      </div>
      <p class="game-help">
        <span class="help-keys">Arrows move &middot; Space jumps &middot; P pauses &middot; M sound</span>
        <span class="help-touch">Tap to start &middot; &#9664; &#9654; move &middot; JUMP jumps</span>
        <span class="back">&middot; <a href="../">Back to the site</a></span>
      </p>
    </div>

    <!-- Screen readers: the results are read out here -->
    <p class="sr-only" id="game-status" aria-live="polite"></p>
  </main>

  <script src="game-audio.js"></script>
  <script src="game.js"></script>
  <script>
    // Standalone page: focus the game straight away so the keys work
    if (!document.documentElement.classList.contains('embedded')) {
      document.getElementById('game-canvas').focus({ preventScroll: true });
    }
  </script>
</body>
</html>
