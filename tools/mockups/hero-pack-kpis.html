<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="mock.css">
<!-- The home page hero picture on phones (under 480 px): just the management pack's KPI tiles, laid out for 360 x 190 px
     and rendered at 2x and 3x (media/mockups/hero-pack-kpis.png, hero-pack-kpis@3x.png). Numbers as boardroom.html.
     Re-render: python3 tools/render_mockups.py -->
<style>
html,body{width:360px;height:190px}
body{background:#f4f7f2;color:#25342a;padding:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.top h1{font-size:14px;letter-spacing:-.01em}.top span{font-size:11px;color:#5f6f63}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kpi{background:#fff;border:1px solid #dce8dc;border-radius:8px;padding:7px 10px 8px}
.kpi h2{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#5f6f63;font-weight:700;white-space:nowrap}
.kpi b{display:block;font-size:22px;line-height:1.15;margin-top:1px}.kpi small{font-size:10px;color:#5f6f63;white-space:nowrap}
.up{color:#2f7a5d}.down{color:#b93a3a}
</style>
<body>
<div class="top"><h1>Management pack · September</h1><span>Year to date</span></div>
<div class="kpis">
 <div class="kpi"><h2>Revenue vs budget</h2><b class="up">+2.8%</b><small>$4.29M vs $4.18M</small></div>
 <div class="kpi"><h2>True gross margin</h2><b>31.4%</b><small class="down">▼ 2.1 pts after freight</small></div>
 <div class="kpi"><h2>Debtor days</h2><b>38 days</b><small class="up">▼ 4 days on last quarter</small></div>
 <div class="kpi"><h2>Forecast vs budget</h2><b class="up">+1.8%</b><small>rolling 12 months</small></div>
</div>
</body>
