<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="mock.css">
<!-- The home page hero picture: a crop of the boardroom management pack (boardroom.html), laid out for 460 x 388 px
     and rendered at 2x and 3x (media/mockups/hero-pack.png, hero-pack@3x.png). Same Sample Co numbers as boardroom.html.
     hero-pack-kpis.html is the phone version: the KPI tiles only. Re-render: python3 tools/render_mockups.py -->
<style>
html,body{width:460px;height:388px}
body{background:#f4f7f2;color:#25342a;padding:14px 16px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.top h1{font-size:17px;letter-spacing:-.01em}.top span{font-size:11.5px;color:#5f6f63}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.kpi{background:#fff;border:1px solid #dce8dc;border-radius:9px;padding:7px 12px 8px}
.kpi h2{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#5f6f63;font-weight:700}
.kpi b{display:block;font-size:22px;line-height:1.15;margin-top:1px}.kpi small{font-size:10.5px;color:#5f6f63}
.up{color:#2f7a5d}.down{color:#b93a3a}
.card{background:#fff;border:1px solid #dce8dc;border-radius:9px;padding:9px 12px 4px;height:170px}
.card h2{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#5f6f63;font-weight:700;margin-bottom:2px}
</style>
<body>
<div class="top"><h1>Management pack · September</h1><span>Year to date</span></div>
<div class="kpis">
 <div class="kpi"><h2>Revenue vs budget</h2><b class="up">+2.8%</b><small>$4.29M vs $4.18M</small></div>
 <div class="kpi"><h2>True gross margin</h2><b>31.4%</b><small class="down">▼ 2.1 pts after freight &amp; wastage</small></div>
 <div class="kpi"><h2>Debtor days</h2><b>38 days</b><small class="up">▼ 4 days on last quarter</small></div>
 <div class="kpi"><h2>Forecast vs budget</h2><b class="up">+1.8%</b><small>rolling 12 months, driver-based</small></div>
</div>
<div class="card"><h2>Revenue: actual, budget and forecast</h2>
 <!-- the boardroom chart's lines, in the same 800-wide coordinates -->
 <svg viewBox="0 0 800 270" width="100%" height="140">
  <g font-size="21"><rect x="40" y="6" width="34" height="7" fill="#2f7a5d"/><text x="84" y="16" fill="#5f6f63">Actual</text><rect x="190" y="6" width="34" height="7" fill="#9db8a6"/><text x="234" y="16" fill="#5f6f63">Budget</text><circle cx="356" cy="10" r="5" fill="#2f7a5d"/><circle cx="371" cy="10" r="5" fill="#2f7a5d"/><text x="388" y="16" fill="#5f6f63">Forecast</text></g>
  <g transform="translate(0,-48) scale(1,0.78)">
   <g stroke="#eaf6ee" stroke-width="2.5"><line x1="40" y1="110" x2="780" y2="110"/><line x1="40" y1="200" x2="780" y2="200"/><line x1="40" y1="290" x2="780" y2="290"/></g>
   <polyline fill="none" stroke="#9db8a6" stroke-width="6" stroke-dasharray="14 10" points="40,317 104,300 167,285 231,274 295,264 358,253 422,244 485,236 549,221 613,199 676,189 740,178"/>
   <polyline fill="none" stroke="#2f7a5d" stroke-width="8" stroke-linejoin="round" points="40,321 104,291 167,253 231,236 295,240 358,214 422,206 485,201 549,184"/>
   <polyline fill="none" stroke="#2f7a5d" stroke-width="7" stroke-dasharray="4 13" stroke-linecap="round" points="549,184 613,145 676,129 740,101"/>
  </g>
  <g font-size="21" fill="#5f6f63"><text x="40" y="262">Jan</text><text x="221" y="262">Apr</text><text x="412" y="262">Jul</text><text x="603" y="262">Oct</text><text x="710" y="262">Dec</text></g>
 </svg>
</div>
</body>
